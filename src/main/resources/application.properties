spring.application.name=pollos-los-campos
server.port=8080

# Perfil por defecto: MySQL/MariaDB (base de datos oficial del proyecto).
# Para trabajar sin MySQL instalado:  -Dspring-boot.run.profiles=h2
spring.profiles.default=mysql

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.delivery.fee=5.00
app.seed.enabled=true
app.admin.email=admin@pollosloscampos.local
app.admin.password=Admin123!
app.admin.code=LOSCAMPOS-ADMIN-2026
