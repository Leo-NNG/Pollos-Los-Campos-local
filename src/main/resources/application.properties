spring.application.name=pollos-los-campos
server.port=8080

# Base de datos EMBEBIDA: se guarda dentro del propio proyecto.
# No requiere MySQL, XAMPP, servidor de base de datos ni credenciales externas.
spring.datasource.url=jdbc:h2:file:./database/pollos_los_campos;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.delivery.fee=5.00
app.seed.enabled=true
app.admin.email=admin@pollosloscampos.local
app.admin.password=Admin123!
app.admin.code=LOSCAMPOS-ADMIN-2026
