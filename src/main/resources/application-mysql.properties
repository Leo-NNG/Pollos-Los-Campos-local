# Perfil MySQL / MariaDB (por defecto).
# Antes de ejecutar: crear la base con los scripts de /database (ver database/README-BD.md).
# Usuario y clave se pueden cambiar sin editar este archivo con variables de entorno:
#   DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pollos_los_campos?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo crean los scripts SQL. Hibernate NO lo modifica: solo VALIDA que
# las entidades coincidan con las tablas (si algo no coincide, falla al iniciar y dice qué columna).
spring.jpa.hibernate.ddl-auto=validate
