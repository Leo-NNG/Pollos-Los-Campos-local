# Perfil opcional: usar MySQL/MariaDB en lugar de H2.
# Ejecutar: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/pollos_los_campos?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# El esquema lo crean los scripts SQL de /database; Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
