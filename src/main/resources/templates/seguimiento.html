<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Seguimiento | Los Campos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div th:replace="~{fragments :: header}"></div>
    <main class="section section-light">
        <div class="container narrow">
            <div class="section-head">
                <div><span class="eyebrow dark">Seguimiento</span>
                    <h1>¿Dónde está mi pedido?</h1>
                    <p class="lead">Ingresa el código y teléfono utilizados al pedir.</p></div>
            </div>
            <form class="form-card" th:action="@{/seguimiento/buscar}" method="post"><input type="hidden"
                                                                                            th:name="${_csrf.parameterName}"
                                                                                            th:value="${_csrf.token}">
                <div class="field"><label>Código de pedido</label><input name="codigo" placeholder="PLC-20260926-0001"
                                                                         required></div>
                <div class="field"><label>Teléfono</label><input name="telefono" maxlength="9" required></div>
                <div class="alert error" th:if="${errorGeneral}" th:text="${errorGeneral}"></div>
                <button class="btn btn-primary full">Consultar pedido</button>
            </form>
            <div class="tracking-card" th:if="${pedido}">
                <div class="tracking-header">
                    <div><span>Pedido</span>
                        <h2 th:text="${pedido.codigoPedido}"></h2>
                        <p th:text="${pedido.nombreCliente + ' ' + (pedido.apellidosCliente ?: '')}"></p><small
                                th:text="${#temporals.format(pedido.fechaCreacion,'dd/MM/yyyy HH:mm')}"></small></div>
                    <strong th:text="'S/ '+${pedido.total}"></strong></div>
                <div class="status-badge" th:text="${pedido.estado}"></div>
                <div class="timeline" th:if="${pedido.estado.name()!='CANCELADO'}">
                    <div th:each="st:${T(com.pollosloscampos.entity.EstadoPedido).values()}"
                         th:if="${st.name()!='CANCELADO'}" class="timeline-step"
                         th:classappend="${st.ordinal()<pedido.estado.ordinal()?'done':(st==pedido.estado?'current':'')}">
                        <span></span>
                        <p th:text="${st.name().replace('_',' ')}"></p></div>
                </div>
                <div class="alert error" th:if="${pedido.estado.name()=='CANCELADO'}">Este pedido fue cancelado.</div>
                <div class="tracking-items">
                    <div th:each="d:${pedido.detalles}"><span th:text="${d.cantidad}+' × '+${d.producto.nombre}"></span><strong
                            th:text="'S/ '+${d.subtotal}"></strong></div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
<div th:replace="~{fragments :: tabbar}"></div>
</body>
</html>
