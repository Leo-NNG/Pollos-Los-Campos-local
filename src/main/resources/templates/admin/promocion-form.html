<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Promoción | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-top">
            <div><span class="eyebrow dark">Marketing</span>
                <h1 th:text="${promoId==null?'Nueva promoción':'Editar promoción'}"></h1></div>
        </div>
        <form class="admin-card form-card" th:action="@{/admin/promociones/guardar}" th:object="${promoForm}"
              method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input
                type="hidden" name="id" th:value="${promoId}">
            <div class="form-row">
                <div class="field"><label>Nombre</label><input th:field="*{nombre}"></div>
                <div class="field"><label>Precio promocional</label><input th:field="*{precioPromocional}" type="number"
                                                                           step="0.01"></div>
            </div>
            <div class="field"><label>Descripción</label><textarea th:field="*{descripcion}" rows="3"></textarea></div>
            <div class="form-row">
                <div class="field"><label>Precio anterior</label><input th:field="*{precioAnterior}" type="number"
                                                                        step="0.01"></div>
                <div class="field"><label>Imagen</label><input th:field="*{imagen}"></div>
            </div>
            <div class="form-row">
                <div class="field"><label>Stock disponible</label><input th:field="*{stock}" type="number" min="0"
                                                                         step="1"></div>
                <div class="field"><label>&nbsp;</label></div>
            </div>
            <div class="form-row">
                <div class="field"><label>Inicio</label><input th:field="*{fechaInicio}" type="date"></div>
                <div class="field"><label>Fin</label><input th:field="*{fechaFin}" type="date"></div>
            </div>
            <label class="check"><input th:field="*{activa}" type="checkbox"> Activa</label>
            <div class="hero-actions">
                <button class="btn btn-primary">Guardar</button>
                <a class="btn btn-ghost" th:href="@{/admin/promociones}">Cancelar</a></div>
        </form>
    </main>
</div>
</body>
</html>
