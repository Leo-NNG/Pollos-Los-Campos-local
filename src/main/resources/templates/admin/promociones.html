<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Promociones | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-section-head">
            <div><span class="eyebrow dark">Marketing</span>
                <h1>Promociones</h1></div>
            <a class="btn btn-primary" th:href="@{/admin/promociones/nueva}">+ Nueva promoción</a></div>
        <div class="promo-admin-grid">
            <article class="admin-card" th:each="p:${promociones}">
                <div class="admin-card-head"><span class="tag" th:text="${p.activa?'ACTIVA':'INACTIVA'}"></span><strong
                        th:text="'S/ '+${p.precioPromocional}"></strong></div>
                <h3 th:text="${p.nombre}"></h3>
                <p th:text="${p.descripcion}"></p><small th:text="${p.fechaInicio+' → '+p.fechaFin}"></small>
                <div class="stock-row"><span class="status-badge" th:classappend="${p.stock>0?'ok':'off'}"
                                             th:text="'Stock: '+${p.stock}"></span>
                    <form th:action="@{/admin/promociones/{id}/stock(id=${p.id})}" method="post" class="stock-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input
                            type="hidden" name="delta" value="-1">
                        <button class="btn btn-ghost btn-sm" type="submit" title="Quitar 1">−</button>
                    </form>
                    <form th:action="@{/admin/promociones/{id}/stock(id=${p.id})}" method="post" class="stock-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input
                            type="hidden" name="delta" value="1">
                        <button class="btn btn-ghost btn-sm" type="submit" title="Agregar 1">+</button>
                    </form>
                    <form th:action="@{/admin/promociones/{id}/stock(id=${p.id})}" method="post" class="stock-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input
                            type="number" name="delta" placeholder="±" style="width:60px" required>
                        <button class="btn btn-secondary btn-sm" type="submit">Ajustar</button>
                    </form>
                </div>
                <div class="actions"><a class="btn btn-secondary btn-sm"
                                        th:href="@{/admin/promociones/{id}/editar(id=${p.id})}">Editar</a>
                    <form th:if="${!p.activa}" th:action="@{/admin/promociones/{id}/toggle(id=${p.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-ghost btn-sm" type="submit">Restaurar</button>
                    </form>
                    <form th:if="${p.activa}" th:action="@{/admin/promociones/{id}/eliminar(id=${p.id})}" th:id="'form-eliminar-' + ${p.id}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-danger btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                th:attr="data-form='form-eliminar-' + ${p.id}">
                            Eliminar
                        </button>
                    </form>
                </div>
            </article>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEliminarTitulo">Eliminar promoción</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                Dejará de mostrarse en el sitio, pero el registro se conserva en la base de datos y puede restaurarse.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger btn-sm" id="confirmarEliminar">Sí, eliminar</button>
            </div>
        </div>
    </div>
</div>
<script>
    (function () {
        var form = null, modal = document.getElementById('modalEliminar');
        modal.addEventListener('show.bs.modal', function (e) {
            form = document.getElementById(e.relatedTarget.getAttribute('data-form'));
        });
        document.getElementById('confirmarEliminar').addEventListener('click', function () {
            if (form) form.submit();
        });
    })();
</script>
</body>
</html>
