<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Producto | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-top">
            <div><span class="eyebrow dark">Catálogo</span>
                <h1 th:text="${productoId==null?'Nuevo producto':'Editar producto'}"></h1></div>
        </div>
        <form class="admin-card form-card" th:action="@{/admin/productos/guardar}" th:object="${productoForm}"
              method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input
                type="hidden" name="id" th:value="${productoId}">
            <div class="form-row">
                <div class="field"><label>Nombre</label><input th:field="*{nombre}"><small class="error"
                                                                                           th:errors="*{nombre}"></small>
                </div>
                <div class="field"><label>Precio</label><input th:field="*{precio}" type="number" step="0.01"><small
                        class="error" th:errors="*{precio}"></small></div>
            </div>
            <div class="field"><label>Descripción</label><textarea th:field="*{descripcion}" rows="3"></textarea><small
                    class="error" th:errors="*{descripcion}"></small></div>
            <div class="form-row">
                <div class="field"><label>Categoría</label><select th:field="*{categoriaId}">
                    <option value="">Selecciona</option>
                    <option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select></div>
                <div class="field"><label>Imagen</label><input th:field="*{imagen}"></div>
            </div>
            <div class="form-row"><label class="check"><input th:field="*{disponible}" type="checkbox">
                Disponible</label><label class="check"><input th:field="*{destacado}" type="checkbox"> Destacado</label>
            </div>
            <div class="field"><label>Etiqueta</label><input th:field="*{etiqueta}" placeholder="Más pedido"></div>
            <div class="hero-actions">
                <button class="btn btn-primary">Guardar</button>
                <a class="btn btn-ghost" th:href="@{/admin/productos}">Cancelar</a></div>
        </form>
    </main>
</div>
</body>
</html>
