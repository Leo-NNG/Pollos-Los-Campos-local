<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clientes | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-top">
            <div><span class="eyebrow dark">Usuarios</span>
                <h1>Clientes</h1></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Celular</th>
                    <th>Registro</th>
                    <th>Pedidos</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c:${clientes}">
                    <td th:text="${c.nombres+' '+c.apellidos}"></td>
                    <td th:text="${c.correo}"></td>
                    <td th:text="${c.celular}"></td>
                    <td th:text="${#temporals.format(c.fechaRegistro,'dd/MM/yyyy')}"></td>
                    <td th:text="${pedidoCounts[c.id]}"></td>
                    <td th:text="${c.activo?'ACTIVO':'INACTIVO'}"></td>
                    <td>
                        <form th:action="@{/admin/clientes/{id}/toggle(id=${c.id})}" method="post"><input type="hidden"
                                                                                                          th:name="${_csrf.parameterName}"
                                                                                                          th:value="${_csrf.token}">
                            <button class="btn btn-ghost btn-sm" th:text="${c.activo?'Desactivar':'Activar'}"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
