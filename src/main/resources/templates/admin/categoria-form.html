<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Categoría | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-top">
            <div><span class="eyebrow dark">Catálogo</span>
                <h1 th:text="${categoriaId==null?'Nueva categoría':'Editar categoría'}"></h1></div>
        </div>
        <form class="admin-card form-card" th:action="@{/admin/categorias/guardar}" th:object="${categoriaForm}"
              method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input
                type="hidden" name="id" th:value="${categoriaId}">
            <div class="field"><label>Nombre</label><input th:field="*{nombre}"><small class="error"
                                                                                       th:errors="*{nombre}"></small>
            </div>
            <div class="field"><label>Descripción</label><textarea th:field="*{descripcion}" rows="4"></textarea></div>
            <div class="hero-actions">
                <button class="btn btn-primary">Guardar</button>
                <a class="btn btn-ghost" th:href="@{/admin/categorias}">Cancelar</a></div>
        </form>
    </main>
</div>
</body>
</html>
