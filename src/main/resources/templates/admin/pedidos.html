<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pedidos | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-top">
            <div><span class="eyebrow dark">Operaciones</span>
                <h1>Pedidos</h1></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Pago</th>
                    <th>Entrega</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p:${pedidos}">
                    <td th:text="${p.codigoPedido}"></td>
                    <td th:text="${p.nombreCliente}"></td>
                    <td th:text="${#temporals.format(p.fechaCreacion,'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="'S/ '+${p.total}"></td>
                    <td th:text="${p.metodoPago}"></td>
                    <td th:text="${p.tipoEntrega}"></td>
                    <td><span class="status-badge small" th:text="${p.estado}"></span></td>
                    <td><a class="btn btn-secondary btn-sm" th:href="@{/admin/pedidos/{id}(id=${p.id})}">Ver</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
