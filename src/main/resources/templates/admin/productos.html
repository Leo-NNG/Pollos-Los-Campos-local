<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Productos | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments :: sidebar}"></div>
    <main class="admin-main">
        <div class="admin-section-head">
            <div><span class="eyebrow dark">Catálogo</span>
                <h1>Productos</h1></div>
            <a class="btn btn-primary" th:href="@{/admin/productos/nuevo}">+ Nuevo producto</a></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Disponible</th>
                    <th>Destacado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p:${productos}">
                    <td>
                        <div class="table-product"><img th:src="@{${p.imagen}}" th:alt="${p.nombre}"><span
                                th:text="${p.nombre}"></span></div>
                    </td>
                    <td th:text="${p.categoria.nombre}"></td>
                    <td th:text="'S/ '+${p.precio}"></td>
                    <td th:text="${p.disponible?'ACTIVO':'INACTIVO'}"></td>
                    <td th:text="${p.destacado?'Sí':'No'}"></td>
                    <td class="actions"><a class="btn btn-secondary btn-sm"
                                           th:href="@{/admin/productos/{id}/editar(id=${p.id})}">Editar</a>
                        <form th:action="@{/admin/productos/{id}/toggle(id=${p.id})}" method="post"><input type="hidden"
                                                                                                           th:name="${_csrf.parameterName}"
                                                                                                           th:value="${_csrf.token}">
                            <button class="btn btn-ghost btn-sm"
                                    th:text="${p.disponible?'Desactivar':'Activar'}"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
