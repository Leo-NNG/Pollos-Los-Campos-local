<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mi cuenta | Los Campos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div th:replace="~{fragments :: header}"></div>
    <main class="section section-light">
        <div class="container">
            <div class="account-head">
                <div><span class="eyebrow dark">Mi cuenta</span>
                    <h1 th:text="${usuario.nombres+' '+usuario.apellidos}"></h1>
                    <p th:text="${usuario.correo}"></p>
                    <div th:if="${usuario.rol.name()=='ROLE_ADMIN'}"
                         style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-flame btn-sm"
                                                                                        th:href="@{/admin}">Ir al panel
                        de administración</a><a class="btn btn-secondary btn-sm" th:href="@{/admin/promociones}">Promociones
                        y stock</a></div>
                </div>
                <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}"
                                                                  th:value="${_csrf.token}">
                    <button class="btn btn-ghost">Cerrar sesión</button>
                </form>
            </div>
            <div class="section-head">
                <div><span class="eyebrow dark">Historial</span>
                    <h2>Mis pedidos</h2></div>
            </div>
            <div class="table-wrap" th:if="${!#lists.isEmpty(pedidos)}">
                <table>
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p:${pedidos}">
                        <td th:text="${p.codigoPedido}"></td>
                        <td th:text="${#temporals.format(p.fechaCreacion,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="'S/ '+${p.total}"></td>
                        <td><span class="status-badge small" th:text="${p.estado}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(pedidos)}"><span>🛒</span>
                <h2>Aún no tienes pedidos</h2><a th:href="@{/menu}" class="btn btn-primary">Explorar menú</a></div>
        </div>
    </main>
    <div th:replace="~{fragments :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
<div th:replace="~{fragments :: tabbar}"></div>
</body>
</html>
