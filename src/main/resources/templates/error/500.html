<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>500 | Los Campos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<section class="section" style="min-height:60vh;display:flex;align-items:center;">
    <div class="container" style="text-align:center;max-width:520px;">
        <p class="eyebrow">500</p>
        <h1 style="margin:10px 0 14px;">Ocurrió un problema</h1>
        <p style="color:var(--ink-soft);margin-bottom:28px;">Algo falló al procesar tu solicitud. Inténtalo nuevamente
            en unos segundos.</p>
        <p th:if="${detalle}" th:text="${detalle}"
           style="font-family:monospace;font-size:.78rem;background:var(--paper-2);border-radius:10px;padding:10px 14px;color:#8a2c11;margin-bottom:22px;word-break:break-word;"></p>
        <a th:href="@{/}" class="btn btn-flame">Volver al inicio</a>
    </div>
</section>
<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
